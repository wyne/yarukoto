<!--
  The Yarukoto mark, and the source the PNG icons are cut from: the same black
  rounded square and accent check that FirstRunScreen draws (styles.logo plus
  IconCheckBig, at colors.textPrimary and DEFAULT_ACCENT). The check path is
  IconCheckBig's, scaled from its 18-unit viewBox to half the canvas and centred.

  Icons with a transparent surround (favicon.png) keep the 25% corner radius;
  the ones a platform masks itself (apple-touch-icon, the maskable manifest
  icon) are cut full-bleed from a squared-off version of this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Yarukoto</title>
  <rect width="512" height="512" rx="128" ry="128" fill="#1A1A18" />
  <g transform="translate(128 128) scale(14.222)">
    <path
      d="M3 9.5l4 4 8-9"
      fill="none"
      stroke="#2E52E0"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
