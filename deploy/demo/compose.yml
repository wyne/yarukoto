# The public demo server App Review signs in to. Not a template for a real
# install: its data is wiped and re-seeded every night by reset.sh.
services:
  yarukoto:
    image: ghcr.io/wyne/yarukoto:latest
    restart: unless-stopped
    environment:
      YARUKOTO_TOKEN: ${YARUKOTO_TOKEN:?run startup.sh, which writes .env}
      PORT: 8080
      DATABASE_PATH: /data/yarukoto.db
      YARUKOTO_TZ: ${YARUKOTO_TZ:-America/Los_Angeles}
      # Read by seed.mjs only; the reviewer's sign-in is a device row reset.sh writes.
      YARUKOTO_REVIEWER_TOKEN: ${YARUKOTO_REVIEWER_TOKEN:-}
      # The data is thrown away nightly; nothing here is worth a snapshot.
      BACKUP_INTERVAL_HOURS: 0
      TRUST_PROXY: "true"
    volumes:
      - ./data:/data
      - ./seed.mjs:/seed/seed.mjs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?run startup.sh, which writes .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  caddy-data:
