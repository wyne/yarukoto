# Yarukoto on a Synology NAS (Container Manager → Project).
#
# Paste this as the project's compose file. It pulls a prebuilt image, so the NAS
# never has to compile anything — building on-device would need the Metro bundler
# and a native better-sqlite3 compile, which is slow at best on NAS hardware.
#
# Two edits before you start it:
#   1. YARUKOTO_TOKEN below — generate one and paste it in.
#   2. The volume path, if your data isn't on volume1.
#
# Generate a token (any machine):  openssl rand -hex 32
#
# The token is written in plain text here, which is normal for a Container
# Manager project — the file sits in a folder only NAS admins can read. Keep it
# out of anything you'd share, and don't reuse a password you use elsewhere.

services:
  yarukoto:
    # `latest` tracks the main branch. Updates are NOT automatic: the NAS keeps
    # whatever it pulled and won't look again until told to, so updating means
    #     docker compose pull && docker compose up -d
    # Pin an immutable build instead if you'd rather decide when to move, e.g.
    # ghcr.io/wyne/yarukoto:sha-366ba58 — that's also the only way to roll back,
    # since `latest` just moves to the newest build.
    image: ghcr.io/wyne/yarukoto:latest
    restart: unless-stopped

    ports:
      # Format is "HOST:CONTAINER".
      #
      # Only change the LEFT number — that's the port you'll use in the browser.
      # DSM takes 5000/5001 and other packages often claim 8080, so if 8080 is
      # already in use pick something free, e.g.:
      #
      #     - "8322:8080"      then browse to http://<nas-ip>:8322
      #
      # Leave the RIGHT number as 8080: it's the port inside the container, and
      # it has to keep matching the PORT value below.
      - "8080:8080"

    environment:
      # ---- paste your generated token here ----
      YARUKOTO_TOKEN: CHANGE_ME_RUN_openssl_rand_hex_32
      # -----------------------------------------
      # The port inside the container. Leave this alone — it pairs with the
      # right-hand number in `ports:` above, not the one you browse to.
      PORT: 8080
      DATABASE_PATH: /data/yarukoto.db
      TRASH_RETENTION_DAYS: 30
      HISTORY_REVISIONS_PER_TASK: 50

    volumes:
      # Create this folder first in File Station (e.g. docker/yarukoto/data).
      # Everything Yarukoto stores lives in one SQLite file inside it — back the
      # app up by stopping the project and copying that folder.
      - /volume1/docker/yarukoto/data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
