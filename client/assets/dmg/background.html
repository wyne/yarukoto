<!doctype html>
<!--
  Source for the Mac disk image's window background (background.png and
  background@2x.png beside this file). release-mac.sh lays the app icon and an
  Applications link over it at the positions in dmg-settings.py, so the arrow
  below has to sit between those two points.

  It is 28pt taller than the 400pt the layout uses, because whether Finder
  counts the title bar inside the window's bounds has varied; the spare strip at
  the bottom is plain gradient either way.

  To change it, edit this file and re-render both sizes at 640x428, for example
  with Playwright's screenshot at deviceScaleFactor 1 and 2. The font is IBM
  Plex Sans, the landing page's; point the @font-face at a local copy to render.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Plex'; font-weight: 400; src: url('plex-sans-400.woff2') format('woff2'); }
  @font-face { font-family: 'Plex'; font-weight: 600; src: url('plex-sans-600.woff2') format('woff2'); }
  html, body { margin: 0; }
  body {
    width: 640px;
    height: 428px;
    overflow: hidden;
    position: relative;
    font-family: 'Plex', -apple-system, sans-serif;
    background:
      radial-gradient(120% 90% at 50% 0%, #FFFFFF 0%, rgba(255, 255, 255, 0) 70%),
      linear-gradient(180deg, #F6F6F1 0%, #EEF1EC 100%);
    color: #1A1A18;
  }
  /* Soft wells behind the two icons, so they read as "from" and "to". */
  .well {
    position: absolute;
    top: 88px;
    width: 168px;
    height: 194px;
    border-radius: 36px;
    background: rgba(255, 255, 255, 0.65);
    box-shadow: inset 0 0 0 1px rgba(26, 26, 24, 0.05);
  }
  .well.from { left: 76px; }
  .well.to { left: 396px; }
  svg { position: absolute; left: 0; top: 0; }
  .caption {
    position: absolute;
    left: 0;
    right: 0;
    top: 318px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .sub {
    position: absolute;
    left: 0;
    right: 0;
    top: 342px;
    text-align: center;
    font-size: 12.5px;
    color: #6B6B64;
  }
</style>
</head>
<body>
  <div class="well from"></div>
  <div class="well to"></div>
  <svg width="640" height="400" viewBox="0 0 640 400" aria-hidden="true">
    <defs>
      <linearGradient id="stroke" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#9CC7B9" />
        <stop offset="1" stop-color="#5E9C89" />
      </linearGradient>
    </defs>
    <path d="M 262 168 C 300 128, 340 128, 378 168" fill="none" stroke="url(#stroke)"
          stroke-width="4" stroke-linecap="round" stroke-dasharray="1 11" />
    <path d="M 362.4 164.9 L 378 168 L 375.6 152.2" fill="none" stroke="#5E9C89"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  <div class="caption">Drag Yarukoto to Applications to install</div>
  <div class="sub">Then open it from Launchpad or your Applications folder.</div>
</body>
</html>
