name: Publish container image

# Builds a ready-to-run image so a NAS (or anything else) can pull it instead of
# compiling on the box. Building on a low-power device is the thing this avoids:
# the web bundle alone needs the Metro bundler and a few hundred npm packages.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 Synology models need an arm64 image; most x86 models need amd64.
      # QEMU only has to emulate the native better-sqlite3 rebuild — the JS
      # stages are pinned to the build platform in the Dockerfile.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          # Stamps the running server's /api/v1/health with the commit it was built
          # from, so a deployed instance can be traced back to a sha.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
