name: Windows app

# Builds the Windows app (windows/, a Tauri shell around the web export) and
# attaches its installers to the run. Deliberately manual, like the other app
# builds: Actions > Windows app > Run workflow. A Windows build takes long
# enough that running it on every pull request held up review.
#
# desktop-release.yml calls this too, with a version and ref, and attaches the
# result to this repository's app release. A run started here is only attached
# to the run.
#
# The installers are unsigned, so SmartScreen warns on first launch: "More
# info", then "Run anyway".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build. Empty uses the selected branch.
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: Version to stamp on the installers, in place of tauri.conf.json's
        type: string
        required: false
        default: ''
      ref:
        description: Git ref to build
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Install dependencies
        run: npm ci --workspace yarukoto-client --workspace yarukoto-windows --workspace @yarukoto/domain

      # beforeBuildCommand in tauri.conf.json exports the web client first.
      - name: Build
        working-directory: windows
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            npm run build -- --config "{\"version\":\"$VERSION\"}"
          else
            npm run build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            windows/target/release/bundle/nsis/*.exe
            windows/target/release/bundle/msi/*.msi
          if-no-files-found: error
