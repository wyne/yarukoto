# Production builds and store submission. EAS manages the monotonically
# increasing native build numbers; the tag/package version is the user-facing
# SemVer shared by iOS, Android, Mac, and Windows.
name: Production mobile release

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      tag:
        description: Release tag, verified against package.json
        required: true
        type: string
      platform:
        description: ios, android, or all
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild (for example v1.0.0)
        required: true
        type: string
      platform:
        description: Platform to build
        required: true
        type: choice
        default: all
        options: [all, ios, android]

permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS production build (${{ inputs.platform }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          npm ci --workspace yarukoto-client --workspace @yarukoto/domain
          # Rebuilds use this workflow with older tags; v1.0.0 expects Expo here.
          mkdir -p client/node_modules/.bin
          if [ ! -e client/node_modules/.bin/expo ]; then
            ln -s ../../../node_modules/.bin/expo client/node_modules/.bin/expo
          fi

      - name: Release preflight
        working-directory: client
        run: scripts/release-preflight.sh "${{ inputs.tag }}"

      - name: Queue production build and submission
        working-directory: client
        run: |
          eas build \
            --profile production \
            --platform "${{ inputs.platform }}" \
            --non-interactive \
            --no-wait \
            --auto-submit \
            --message "${{ inputs.tag }} (${{ github.sha }})"

      - name: Summary
        run: |
          {
            echo "### Production build queued"
            echo
            echo "- Tag: \`${{ inputs.tag }}\`"
            echo "- Platform: \`${{ inputs.platform }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo
            echo "EAS submits iOS to App Store Connect and Android to the Play internal track after each build finishes. Store release remains a human action."
          } >> "$GITHUB_STEP_SUMMARY"

