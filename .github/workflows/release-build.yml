# Production builds and store submission. EAS manages the monotonically
# increasing native build numbers; the tag/package version is the user-facing
# SemVer shared by iOS, Android, Mac, and Windows.
name: Production mobile release

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      tag:
        description: Release tag, verified against package.json
        required: true
        type: string
      platform:
        description: ios, android, or all
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      # Optional: a required input left blank makes GitHub refuse the dispatch
      # with a generic "Workflow could not be run" instead of a usable error.
      tag:
        description: Release tag to rebuild (for example v1.0.0); leave empty for the latest release
        required: false
        type: string
        default: ''
      platform:
        description: Platform to build
        required: true
        type: choice
        default: all
        options: [all, ios, android]

permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS production build (${{ inputs.platform }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
            if [ -z "$TAG" ]; then
              echo "No v* release tag exists to rebuild." >&2
              exit 1
            fi
            git checkout --detach "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          npm ci --workspace yarukoto-client --workspace @yarukoto/domain
          # Rebuilds use this workflow with older tags; v1.0.0 expects Expo here.
          mkdir -p client/node_modules/.bin
          if [ ! -e client/node_modules/.bin/expo ]; then
            ln -s ../../../node_modules/.bin/expo client/node_modules/.bin/expo
          fi

      - name: Release preflight
        working-directory: client
        run: scripts/release-preflight.sh "${{ steps.release.outputs.tag }}"

      - name: Queue production build and submission
        working-directory: client
        run: |
          eas build \
            --profile production \
            --platform "${{ inputs.platform }}" \
            --non-interactive \
            --no-wait \
            --auto-submit \
            --message "${{ steps.release.outputs.tag }} (${{ steps.release.outputs.sha }})"

      - name: Summary
        run: |
          {
            echo "### Production build queued"
            echo
            echo "- Tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Platform: \`${{ inputs.platform }}\`"
            echo "- Commit: \`${{ steps.release.outputs.sha }}\`"
            echo
            echo "EAS submits iOS to App Store Connect and Android to the Play internal track after each build finishes. Store release remains a human action."
          } >> "$GITHUB_STEP_SUMMARY"

