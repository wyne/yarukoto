name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          PATTERN='^(feat|fix|perf|revert|refactor|docs|build|ci|deps|chore|test|style)(\([^)]+\))?!?: .+'
          check_title() {
            local label="$1"
            local title="$2"
            if [[ ! "$title" =~ $PATTERN ]]; then
              echo "$label must be conventional; got: $title" >&2
              echo "Use a title such as 'fix: keep reminders after sync' or 'feat(client): add widgets'." >&2
              exit 1
            fi
          }

          check_title "PR title" "$PR_TITLE"

          # The repository uses GitHub's COMMIT_OR_PR_TITLE squash setting:
          # a one-commit PR keeps that commit's title, while a multi-commit PR
          # uses the PR title. Validate the second possible source as well.
          if [ "$PR_COMMITS" = 1 ]; then
            check_title "Single commit title" "$(git log -1 --format=%s)"
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace yarukoto-client --workspace yarukoto-server --workspace @yarukoto/domain

      - name: Test server
        working-directory: server
        run: npm run test:coverage

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Test client
        working-directory: client
        run: npm run test:coverage -- --ci

      - name: Type-check client
        working-directory: client
        run: npm run typecheck

      - name: Install browser for end-to-end tests
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Test web sync end to end
        working-directory: client
        run: npm run test:e2e

      - name: Build coverage report
        run: node .github/scripts/coverage-report.mjs "$RUNNER_TEMP/coverage-report.md"

      - name: Report coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          COVERAGE_REPORT: ${{ runner.temp }}/coverage-report.md
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync(process.env.COVERAGE_REPORT, 'utf8');
            const marker = '<!-- yarukoto-coverage -->';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number: context.issue.number, per_page: 100 },
            );
            const previous = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
