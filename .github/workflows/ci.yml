name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Test server
        working-directory: server
        run: npm run test:coverage

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Test client
        working-directory: client
        run: npm run test:coverage -- --ci

      - name: Type-check client
        working-directory: client
        run: npm run typecheck

      - name: Build coverage report
        run: node .github/scripts/coverage-report.mjs "$RUNNER_TEMP/coverage-report.md"

      - name: Report coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          COVERAGE_REPORT: ${{ runner.temp }}/coverage-report.md
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync(process.env.COVERAGE_REPORT, 'utf8');
            const marker = '<!-- yarukoto-coverage -->';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number: context.issue.number, per_page: 100 },
            );
            const previous = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: homeassistant-tests/requirements.txt

      - name: Install test harness
        run: pip install -r homeassistant-tests/requirements.txt

      - name: Test integration
        working-directory: homeassistant-tests
        run: python -m pytest -q
