name: Release Home Assistant integration

# HACS offers an update when the repo gets a new GitHub release, so this makes
# one whenever custom_components/yarukoto/manifest.json lands on main with a
# version that has no release yet. Bumping that version in a PR is the whole
# release process, and the tag can never disagree with the manifest.
on:
  push:
    branches: [main]
    paths: ['custom_components/yarukoto/manifest.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ha-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "value=$(jq -r .version custom_components/yarukoto/manifest.json)" >> "$GITHUB_OUTPUT"

      # A release made with GITHUB_TOKEN starts no other workflow, so this tag
      # doesn't build a server image either.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
