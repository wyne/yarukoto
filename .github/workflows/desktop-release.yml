name: Desktop release

# Builds a signed, notarized Mac app and the Windows installers, then attaches
# them to this repository's app release. The website and docs link to its
# latest release, so the files keep the same names and those links never change:
#
#   https://github.com/wyne/yarukoto/releases/latest/download/Yarukoto-mac.dmg
#   https://github.com/wyne/yarukoto/releases/latest/download/Yarukoto-windows-setup.exe
#   https://github.com/wyne/yarukoto/releases/latest/download/Yarukoto-windows.msi
#
# Secrets (Settings > Secrets and variables > Actions):
#   MAC_CERTIFICATE_P12       base64 of the "Developer ID Application" certificate
#                             and its private key, exported from Keychain Access as .p12
#   MAC_CERTIFICATE_PASSWORD  the password that export was given
#   APPLE_API_KEY_P8          contents of an App Store Connect API key (.p8), for notarization
#   APPLE_API_KEY_ID          that key's ID
#   APPLE_API_ISSUER_ID       the issuer ID shown above the keys list
# Windows stays unsigned for now, so SmartScreen warns on first launch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 1.0.1). Empty uses package.json.
        type: string
        required: false
        default: ''
      ref:
        description: Git ref to build. Empty uses the selected branch.
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: Version to publish
        type: string
        required: true
      ref:
        description: Git ref to build
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          VERSION="${INPUT:-$(node -p "require('./package.json').version")}"
          VERSION="${VERSION#v}"
          # The MSI and the Mac bundle both require plain major.minor.patch.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3, got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  mac:
    name: Mac
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # CocoaPods aborts on a Podfile path check without a UTF-8 locale.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --workspace yarukoto-client --workspace @yarukoto/domain

      # A throwaway keychain holding only the Developer ID identity, added to
      # the search list so release-mac.sh finds it the way it finds the login
      # keychain's on a laptop.
      - name: Import signing certificate
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"

      - name: Build, sign and notarize
        working-directory: client
        env:
          MAC_VERSION: ${{ needs.version.outputs.version }}
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/release-mac.sh

      - name: Collect
        working-directory: client
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp dist/macos/*/*.dmg "$RUNNER_TEMP/out/Yarukoto-mac.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: ${{ runner.temp }}/out/Yarukoto-mac.dmg
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"

  windows:
    name: Windows
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ inputs.ref || github.ref }}

  publish:
    name: Publish
    needs: [version, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the files
        run: |
          mkdir out
          cp artifacts/mac-release/Yarukoto-mac.dmg out/
          # upload-artifact keeps the bundle/nsis and bundle/msi folders, so the
          # installers are a level down. Find them rather than assume the layout.
          EXE=$(find artifacts/windows -name '*.exe' | head -1)
          MSI=$(find artifacts/windows -name '*.msi' | head -1)
          test -n "$EXE" && test -n "$MSI"
          cp "$EXE" out/Yarukoto-windows-setup.exe
          cp "$MSI" out/Yarukoto-windows.msi
          (cd out && sha256sum * > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt

      # Re-running a version replaces its files rather than failing, so a
      # broken build can be fixed without inventing a new version number.
      - name: Publish to this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          TAG="v$VERSION"
          NOTES="Built from [wyne/yarukoto@${GITHUB_SHA::7}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          - **Mac:** \`Yarukoto-mac.dmg\`, signed and notarized. Open it and drag Yarukoto to Applications.
          - **Windows:** \`Yarukoto-windows-setup.exe\` (or the \`.msi\`). It isn't signed yet, so Windows warns on first launch: choose **More info**, then **Run anyway**."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            TARGET="${SOURCE_REF:-$GITHUB_SHA}"
            gh release create "$TAG" out/* --target "$TARGET" \
              --title "Yarukoto $VERSION" --notes "$NOTES" --latest
          fi
